name: SlommyPanels
version: '${project.version}'
main: net.slommy.slommypanels.SlommyPanels
api-version: '1.20'
depend: [SlommyEssentials, GuiLib, ProtocolLib]
commands:
  spopen:
    description: Opens the SlommyPanels GUI
    usage: /spopen
    permission: slommypanels.open
    aliases: [sp]
  skills:
    description: Opens the Skills GUI
    usage: /skills
    permission: slommypanels.skills
  shop:
    description: Open a shop for a player
    usage: /shop <player> <shop>
  stash:
    description: Open your Treasure Stash
    usage: /stash
  addtreasurebag:
    description: Add a Treasure Bag to your Treasure Stash
    usage: /addtreasurebag <player> <bag> <amount>
    permission: slommypanels.addtreasurebag
  addlockpick:
    description: Add a Lockpick to your Treasure Stash
    usage: /addlockpick <player> <lockpick> <amount>
    permission: slommypanels.addlockpick
  slommyrecipe:
    description: Create or edit a Custom Slommy Recipe
    usage: /slommyrecipe <create/edit> <category> <name>
    permission: slommypanels.slommyrecipe
    aliases: ["sr"]
  profile:
    description: Open a player's profile
    usage: /profile <player>
    aliases: ["pv", "player"]